<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InfoHub · 设置插画</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{margin:0;background:#f6f5f3;color:#252525}
main{max-width:920px;margin:auto;padding:44px 24px}
h1{font-size:28px;margin:0 0 8px}p{color:#818181;line-height:1.6;margin:0}
section{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:28px}
article{background:white;border:1px solid #e8e7e4;border-radius:22px;padding:24px}
h2{font-size:17px;margin:0 0 18px}.sample{display:flex;align-items:center;gap:12px;min-height:52px;font-size:15px}
.sample img{width:42px;height:42px;object-fit:contain}
.active{font-size:12px;color:#858585;margin-top:12px}
.family{display:flex;flex-wrap:wrap;gap:22px;margin-top:20px}
.family img{width:44px;height:44px;object-fit:contain}
@media(prefers-color-scheme:dark){body{background:#101010;color:#f1f1f1}article{background:#1c1c1e;border-color:#303033}.sample img,.family img{filter:brightness(1.45)}}
</style>
</head>
<body><main>
<h1>设置插画</h1><p>同一颜色，三种 2D 风格。以「订阅同步」为例比较。</p>
<section>
<article><h2>A · 线描</h2><div class="sample"><img src="line.png" alt=""><span>订阅同步</span></div></article>
<article><h2>B · 几何实心</h2><div class="sample"><img src="solid.png" alt=""><span>订阅同步</span></div></article>
<article><h2>C · 手绘线条</h2><div class="sample"><img src="hand-drawn.png" alt=""><span>订阅同步</span></div><div class="active">当前 App 使用</div></article>
</section>
<section><article><h2>当前 App 插画</h2><div class="family">
<img src="../../InfoHub/Assets.xcassets/settings-appearance.imageset/illustration.png" alt="外观">
<img src="../../InfoHub/Assets.xcassets/settings-reading.imageset/illustration.png" alt="阅读字号">
<img src="../../InfoHub/Assets.xcassets/settings-sync.imageset/illustration.png" alt="订阅同步">
<img src="../../InfoHub/Assets.xcassets/settings-feedback.imageset/illustration.png" alt="意见反馈">
<img src="../../InfoHub/Assets.xcassets/settings-website.imageset/illustration.png" alt="访问官网">
<img src="../../InfoHub/Assets.xcassets/settings-terms.imageset/illustration.png" alt="服务协议">
<img src="../../InfoHub/Assets.xcassets/settings-privacy.imageset/illustration.png" alt="隐私政策">
<img src="../../InfoHub/Assets.xcassets/settings-version.imageset/illustration.png" alt="版本">
</div></article></section>
</main></body></html>
